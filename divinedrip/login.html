<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Divine Drip</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Poppins&display=swap" rel="stylesheet">
  <style>
    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(to right, #f6e8ea, #e5eaf5);
    }

    .login-box {
      background-color: #fff;
      padding: 2rem 3rem;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      text-align: center;
      width: 350px;
    }

    .login-box h2 {
      font-family: 'Cinzel Decorative', cursive;
      color: #a66cff;
      margin-bottom: 1.5rem;
    }

    .login-box input {
      width: 100%;
      padding: 0.7rem;
      margin: 0.6rem 0;
      border: 1px solid #f0d9ff;
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      outline: none;
    }

    .login-box input:focus {
      border-color: #a66cff;
      box-shadow: 0 0 4px #d3bfff;
    }

    .login-box button {
      background-color: #a66cff;
      color: #fff;
      border: none;
      padding: 0.6rem 1rem;
      width: 100%;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 500;
      transition: background-color 0.3s;
    }

    .login-box button:hover {
      background-color: #8b4dff;
    }

    .login-box p {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #555;
    }

    .login-box a {
      color: #a66cff;
      text-decoration: none;
      font-weight: 500;
    }

    .login-box a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <h2>Welcome Back 👋</h2>
      <form onsubmit="return loginUser(event)">
        <input type="email" id="email" placeholder="Enter your email" required>
        <input type="password" id="password" placeholder="Enter your password" required>
        <button type="submit">Login</button>
      </form>
      <p>Don’t have an account? <a href="#">Sign up</a></p>
    </div>
  </div>

  <script src="script.js"></script>

</body>
</html>
